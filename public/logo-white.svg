<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="jbPinGrad" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#FF3E00" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>

    <linearGradient id="jbColumnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5CAD" />
      <stop offset="45%" stop-color="#0B4896" />
      <stop offset="100%" stop-color="#062758" />
    </linearGradient>

    <linearGradient id="jbRoadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D519D" />
      <stop offset="50%" stop-color="#093C78" />
      <stop offset="100%" stop-color="#041E42" />
    </linearGradient>

    <linearGradient id="jbSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A2F3" />
      <stop offset="50%" stop-color="#55CCFC" />
      <stop offset="85%" stop-color="#AEE7FF" />
      <stop offset="100%" stop-color="#DEF4FF" />
    </linearGradient>

    <linearGradient id="jbSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="40%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <linearGradient id="jbMtnFar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA9DF" />
      <stop offset="100%" stop-color="#1B7AAB" />
    </linearGradient>
    <linearGradient id="jbMtnMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1792B7" />
      <stop offset="100%" stop-color="#0D5D7A" />
    </linearGradient>
    <linearGradient id="jbMtnNear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7B5A" />
      <stop offset="100%" stop-color="#0E4E3A" />
    </linearGradient>

    <linearGradient id="jbSandGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="100%" stop-color="#F2C785" />
    </linearGradient>
    <linearGradient id="jbWaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00A2F3" />
      <stop offset="100%" stop-color="#006BB8" />
    </linearGradient>

    <linearGradient id="jbGreenGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55C96B" />
      <stop offset="60%" stop-color="#2D9A47" />
      <stop offset="100%" stop-color="#1A622C" />
    </linearGradient>
    <linearGradient id="jbGreenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EB358" />
      <stop offset="60%" stop-color="#1F7D35" />
      <stop offset="100%" stop-color="#0E4C1E" />
    </linearGradient>

    <linearGradient id="jbContrailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67D3FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#29B6F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0288D1" stop-opacity="1" />
    </linearGradient>

    <clipPath id="jbLandscapeClip">
      <path d="M 298 190 C 298 190 350 180 410 180 C 475 180 515 215 515 270 C 515 320 480 355 425 365 C 380 372 320 365 298 350 Z" />
    </clipPath>

    <filter id="jbPinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5722" flood-opacity="0.35" />
    </filter>
    <filter id="jbSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#041E42" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Clean White Background Canvas matching user uploaded white image -->
  <rect width="600" height="600" fill="#FFFFFF" rx="48" />

  <!-- 1. Contrails -->
  <path d="M 218 316 C 145 316 138 270 148 240 C 158 205 190 190 220 185"
        stroke="#52CCFC" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 298 190 C 340 182 400 160 455 130"
        stroke="url(#jbContrailGrad)" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- 2. Scenic Landscape -->
  <g clip-path="url(#jbLandscapeClip)" id="jb-scenery">
    <rect x="290" y="170" width="230" height="205" fill="url(#jbSkyGrad)" />
    <circle cx="435" cy="275" r="48" fill="url(#jbSunGrad)" />
    <circle cx="435" cy="275" r="54" fill="#FFAA00" opacity="0.18" />

    <path d="M 325 260 C 325 252 332 246 340 246 C 344 240 352 238 360 241 C 366 236 376 238 380 244 C 386 245 390 250 390 256 C 390 262 385 266 380 266 L 332 266 C 327 266 325 263 325 260 Z"
          fill="#FFFFFF" opacity="0.9" />
    <path d="M 432 225 C 432 218 438 213 445 213 C 449 208 456 207 462 210 C 468 206 476 208 480 213 C 485 214 488 218 488 223 C 488 228 484 231 480 231 L 438 231 C 434 231 432 228 432 225 Z"
          fill="#FFFFFF" opacity="0.85" />

    <path d="M 295 325 L 348 276 L 398 322 L 442 278 L 490 325 L 518 325 L 518 375 L 295 375 Z"
          fill="url(#jbMtnFar)" />
    <path d="M 315 340 L 372 290 L 420 335 L 465 292 L 518 342 L 518 375 L 315 375 Z"
          fill="url(#jbMtnMid)" />
    <path d="M 435 348 L 478 308 L 518 340 L 518 375 L 435 375 Z"
          fill="url(#jbMtnNear)" />

    <path d="M 298 358 C 340 352 385 345 425 352 C 455 357 485 368 518 360 L 518 385 L 298 385 Z"
          fill="url(#jbSandGrad)" />
    <path d="M 330 365 C 375 358 420 356 460 364 C 485 369 505 370 518 366 L 518 385 L 330 385 Z"
          fill="url(#jbWaterGrad)" />

    <path d="M 345 364 C 385 357 425 356 465 363 C 488 367 508 368 518 365"
          stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 370 370 C 410 363 445 363 480 369"
          stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />

    <g transform="translate(478, 305) scale(0.72)">
      <path d="M 12 55 C 16 32 10 14 6 0" stroke="#1F3D2B" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 6 0 C 18 -8 32 -6 38 4" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 6 0 C 22 -18 28 -28 22 -38" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 6 0 C -4 -20 -12 -30 -22 -28" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 6 0 C -18 -8 -28 0 -34 14" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 6 0 C 8 -24 0 -34 -4 -42" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>
    <g transform="translate(496, 320) scale(0.55)">
      <path d="M 10 45 C 14 26 8 10 4 0" stroke="#163322" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 4 0 C 14 -6 26 -4 30 4" stroke="#163322" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 4 0 C 18 -14 22 -22 18 -30" stroke="#163322" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 4 0 C -12 -6 -20 0 -24 10" stroke="#163322" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 4 0 C -2 -16 -8 -24 -16 -22" stroke="#163322" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- 3. Jet Airplane -->
  <g transform="translate(472, 118) rotate(32) scale(0.95)" filter="url(#jbSoftShadow)">
    <path d="M 0 -32 C 4 -32 7 -26 7 -8 L 7 14 C 7 24 5 30 0 32 C -5 30 -7 24 -7 14 L -7 -8 C -7 -26 -4 -32 0 -32 Z"
          fill="#0057B8" />
    <path d="M -7 -4 L -38 12 L -38 20 L -7 11 Z" fill="#0066CC" />
    <path d="M 7 -4 L 38 12 L 38 20 L 7 11 Z" fill="#004D99" />
    <path d="M -2 18 L 0 34 L 2 18 Z" fill="#003D7A" />
    <path d="M -5 23 L -17 30 L -17 34 L -5 28 Z" fill="#0066CC" />
    <path d="M 5 23 L 17 30 L 17 34 L 5 28 Z" fill="#004D99" />
    <path d="M -3 -22 C -1 -24 1 -24 3 -22 L 3 -18 L -3 -18 Z" fill="#80D8FF" opacity="0.8" />
  </g>

  <!-- 4. Main J & Road -->
  <path d="M 213 160 
           L 255 192 
           L 297 160 
           L 297 415 
           C 297 485 245 515 185 490 
           C 130 468 115 410 145 358 
           C 165 320 205 315 220 316
           C 205 315 165 325 140 370
           C 105 430 130 495 195 515
           C 260 535 320 490 320 415
           L 320 160
           Z"
        fill="url(#jbColumnGrad)" />

  <path d="M 220 500 
           C 300 550 430 530 485 460 
           C 530 400 525 335 445 330 
           C 370 325 305 340 297 350
           L 297 375
           C 325 365 375 355 430 360
           C 490 365 500 410 460 455
           C 415 505 300 525 210 470
           Z"
        fill="url(#jbRoadGrad)" />

  <path d="M 155 385 
           C 125 435 145 490 200 512
           C 275 540 395 525 450 465 
           C 485 425 475 380 435 365"
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-dasharray="16 12" 
        stroke-linecap="round" 
        fill="none" 
        opacity="0.95" />

  <line x1="255" y1="215" x2="255" y2="445" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-dasharray="16 14" 
        stroke-linecap="round" 
        opacity="0.9" />

  <!-- 5. Foliage -->
  <path d="M 95 440 C 95 440 120 390 160 380 C 185 375 190 405 180 430 C 170 455 130 475 95 440 Z"
        fill="url(#jbGreenGrad1)" />

  <path d="M 340 515 C 380 500 420 505 455 480 C 480 460 495 435 505 405 C 520 440 515 480 475 515 C 430 550 365 545 340 515 Z"
        fill="url(#jbGreenGrad2)" />
  <path d="M 440 485 C 465 470 485 445 495 420 C 500 435 500 455 485 475 C 470 495 450 500 440 485 Z"
        fill="#55C96B" opacity="0.6" />

  <!-- 6. Traveler -->
  <g id="jb-traveler" transform="translate(180, 420)">
    <path d="M -16 -32 C -24 -24 -26 -6 -18 8 C -14 14 -6 15 -4 10 L -4 -25 C -8 -30 -12 -33 -16 -32 Z"
          fill="#0B3C78" />
    <path d="M -22 -14 C -24 -4 -22 4 -16 6" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M -8 -22 C -4 -16 -4 -4 -6 4" stroke="#062247" stroke-width="3" stroke-linecap="round" fill="none" />

    <path d="M -6 -28 C 0 -28 10 -26 14 -12 C 16 -5 14 8 8 16 L -4 16 C -6 8 -7 -6 -6 -28 Z"
          fill="#FFFFFF" />
    <path d="M 6 -12 C 12 -4 16 4 18 12 C 18 14 14 16 12 14 C 8 8 4 -4 2 -10 Z"
          fill="#F2F5F9" />
    <circle cx="18" cy="14" r="3.5" fill="#FCD5B5" />

    <path d="M -4 14 C 2 14 14 16 22 22 C 26 25 30 32 32 40 L 22 42 C 18 36 14 30 8 28 L -6 24 Z"
          fill="#061D38" />
    <path d="M 22 22 L 28 38 L 22 40 L 16 26 Z" fill="#0A284D" />
    <path d="M 26 38 C 30 38 36 40 38 43 L 30 46 L 24 42 Z" fill="#020E1E" />

    <path d="M 2 -28 L 8 -28 L 8 -34 L 2 -34 Z" fill="#FCD5B5" />
    <circle cx="5" cy="-40" r="9" fill="#FCD5B5" />
    <path d="M -5 -43 C -5 -51 6 -52 14 -46 C 16 -44 16 -40 14 -37 C 8 -37 0 -38 -5 -43 Z"
          fill="#0C3F7C" />
    <path d="M -5 -43 C -11 -42 -15 -39 -17 -37 C -15 -36 -10 -38 -4 -40 Z"
          fill="#062247" />
  </g>

  <!-- 7. Location Pin with Pure White Center Hole -->
  <g id="jb-location-pin" filter="url(#jbPinGlow)">
    <path d="M 255 192 
             C 246 178 207 146 207 118 
             C 207 91.5 228.5 70 255 70 
             C 281.5 70 303 91.5 303 118 
             C 303 146 264 178 255 192 
             Z"
          fill="url(#jbPinGrad)" />
    <circle cx="255" cy="118" r="22" fill="#FFFFFF" />
  </g>
</svg>
